name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see docs/DEPLOY.md)"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/unit
      - run: npm run build
      - name: Ensure queues exist
        run: |
          for q in tt-verification tt-transfer tt-dlq; do npx wrangler queues create "$q" 2>&1 | grep -qiE "created|already" || true; done
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply trusttransfer-db --remote
      - run: npx wrangler deploy
      - name: Sync worker secrets (only those provided; creates a new version)
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
        run: |
          node -e '
            const keys=["SESSION_SECRET","DATA_ENCRYPTION_KEY","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET","TURNSTILE_SITE_KEY","TURNSTILE_SECRET_KEY","BOOTSTRAP_ADMIN_EMAIL"];
            const o={}; for (const k of keys) if (process.env[k]) o[k]=process.env[k];
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(o));
            console.log("syncing", Object.keys(o).length, "secrets");'
          if [ "$(cat /tmp/secrets.json)" != "{}" ]; then npx wrangler secret bulk /tmp/secrets.json; fi
          rm -f /tmp/secrets.json
