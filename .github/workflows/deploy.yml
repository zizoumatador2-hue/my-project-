name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-production
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Diagnose credentials (booleans and variable names only — never values)
        env:
          VAR_NAMES: ${{ join(fromJSON(toJSON(vars)).*, '') != '' }}
          H1: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          H2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          H3: ${{ secrets.CF_API_TOKEN != '' }}
          H4: ${{ secrets.CLOUDFLARE_TOKEN != '' }}
          H5: ${{ secrets.CF_ACCOUNT_ID != '' }}
          H6: ${{ secrets.API_TOKEN != '' }}
          H7: ${{ secrets.ACCOUNT_ID != '' }}
          H8: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
          H9: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
          H10: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL != '' }}
        run: |
          echo "secret CLOUDFLARE_API_TOKEN=$H1 CLOUDFLARE_ACCOUNT_ID=$H2 CF_API_TOKEN=$H3 CLOUDFLARE_TOKEN=$H4 CF_ACCOUNT_ID=$H5 API_TOKEN=$H6 ACCOUNT_ID=$H7 BOOTSTRAP_ADMIN_EMAIL=$H10"
          echo "var CLOUDFLARE_API_TOKEN=$H8 var CLOUDFLARE_ACCOUNT_ID=$H9 any-vars=$VAR_NAMES"
          echo "repo=${{ github.repository }} ref=${{ github.ref }} event=${{ github.event_name }} actor=${{ github.actor }}"
      - name: Normalize credentials (trim whitespace; derive account id from the token if not given)
        run: |
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing (see docs/DEPLOY.md)"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ACC="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          V=$(curl -sS -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -r '.result.status // .errors[0].message // "unknown"')
          if [ "$V" != "active" ] && [ -n "$ACC" ]; then
            # Account-owned tokens verify against the account endpoint instead.
            V=$(curl -sS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACC/tokens/verify" | jq -r '.result.status // .errors[0].message // "unknown"')
            echo "account-token verification used"
          fi
          echo "token status: $V"
          # Shape only (never the value): helps tell an API Token (~40 chars, letters/digits/_-) from a Global API Key (37 hex) or a pasted command.
          echo "token shape: length=${#TOKEN} hex_only=$([[ "$TOKEN" =~ ^[0-9a-f]+$ ]] && echo yes || echo no) has_non_token_chars=$([[ "$TOKEN" =~ [^A-Za-z0-9_-] ]] && echo yes || echo no)"
          if [ -z "$ACC" ]; then
            ACC=$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty')
            N=$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result | length')
            echo "derived account id from token (accounts visible: $N)"
          fi
          if [ -z "$ACC" ]; then echo "::error::Could not determine the Cloudflare account id — add CLOUDFLARE_ACCOUNT_ID secret"; exit 1; fi
          if [ "$V" != "active" ]; then echo "::error::Cloudflare rejected the token ($V)"; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/unit
      - run: npm run build
      - name: Ensure queues exist
        continue-on-error: true
        run: |
          for q in tt-verification tt-transfer tt-dlq; do npx wrangler queues create "$q" 2>&1 | grep -qiE "created|already" || true; done
      - name: Apply D1 migrations (schema already applied; tolerate tokens without D1 permission)
        continue-on-error: true
        run: npx wrangler d1 migrations apply trusttransfer-db --remote
      - name: Resolve workers.dev URL
        id: url
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          if [ -z "$SUB" ] || [ "$SUB" = "null" ]; then echo "::error::No workers.dev subdomain on this account (enable it in Workers & Pages)"; exit 1; fi
          echo "host=trusttransfer.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Deploy worker
        run: npx wrangler deploy --var APP_URL:https://${{ steps.url.outputs.host }}
      - name: Provision secrets (generate missing ones once; never printed)
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY || vars.DATA_ENCRYPTION_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || vars.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || vars.STRIPE_WEBHOOK_SECRET }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY || vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY || vars.TURNSTILE_SECRET_KEY }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL || vars.BOOTSTRAP_ADMIN_EMAIL }}
          CHARGILY_SECRET_KEY: ${{ secrets.CHARGILY_SECRET_KEY || vars.CHARGILY_SECRET_KEY }}
          HOST: ${{ steps.url.outputs.host }}
        run: |
          EXISTING=$(npx wrangler secret list --format json 2>/dev/null | jq -r '.[].name' || true)
          has() { echo "$EXISTING" | grep -qx "$1"; }
          node -e 'const k=["SESSION_SECRET","DATA_ENCRYPTION_KEY","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET","TURNSTILE_SITE_KEY","TURNSTILE_SECRET_KEY","BOOTSTRAP_ADMIN_EMAIL","CHARGILY_SECRET_KEY"];const o={};for(const x of k)if(process.env[x])o[x]=process.env[x];require("fs").writeFileSync("/tmp/s.json",JSON.stringify(o))'
          add() { jq --arg k "$1" --arg v "$2" '. + {($k): $v}' /tmp/s.json > /tmp/s2.json && mv /tmp/s2.json /tmp/s.json; }
          # Keys generated only if the worker doesn't already have them (DATA_ENCRYPTION_KEY must never change once data exists).
          if ! has SESSION_SECRET && [ -z "$SESSION_SECRET" ]; then add SESSION_SECRET "$(openssl rand -base64 48)"; echo "generated SESSION_SECRET"; fi
          if ! has DATA_ENCRYPTION_KEY && [ -z "$DATA_ENCRYPTION_KEY" ]; then add DATA_ENCRYPTION_KEY "$(openssl rand -base64 32)"; echo "generated DATA_ENCRYPTION_KEY"; fi
          # Turnstile widget for the workers.dev host (requires the token to have Turnstile:Edit).
          if ! has TURNSTILE_SECRET_KEY && [ -z "$TURNSTILE_SECRET_KEY" ]; then
            R=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets" \
              -d "{\"name\":\"TrustTransfer\",\"domains\":[\"$HOST\"],\"mode\":\"managed\"}" || echo '{}')
            SK=$(echo "$R" | jq -r '.result.sitekey // empty'); SS=$(echo "$R" | jq -r '.result.secret // empty')
            if [ -n "$SK" ] && [ -n "$SS" ]; then add TURNSTILE_SITE_KEY "$SK"; add TURNSTILE_SECRET_KEY "$SS"; echo "created Turnstile widget"; \
            else echo "::warning::Could not create a Turnstile widget (token lacks Turnstile:Edit?) — signup stays closed until TURNSTILE_* secrets are set"; fi
          fi
          echo "syncing $(jq 'length' /tmp/s.json) secrets"
          if [ "$(jq 'length' /tmp/s.json)" != "0" ]; then npx wrangler secret bulk /tmp/s.json; fi
          rm -f /tmp/s.json
      - name: Smoke test
        run: |
          sleep 5
          curl -fsS "https://${{ steps.url.outputs.host }}/api/health"
          echo "Live at https://${{ steps.url.outputs.host }}" >> "$GITHUB_STEP_SUMMARY"
