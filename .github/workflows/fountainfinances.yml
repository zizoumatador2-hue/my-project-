name: FountainFinances.com
on:
  pull_request:
    paths: ['fountainfinances/**', '.github/workflows/fountainfinances.yml']
  push:
    branches: [main]
    paths: ['fountainfinances/**', '.github/workflows/fountainfinances.yml']
  workflow_dispatch:
defaults:
  run:
    working-directory: fountainfinances
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: fountainfinances/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run qa
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Browser sweep of every page (mobile + desktop)
        run: |
          npx astro preview --port 4321 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          npm run sweep
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: fountainfinances-test-results, path: fountainfinances/test-results }

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency: fountainfinances-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
      PUBLIC_GSC_VERIFICATION: ${{ vars.PUBLIC_GSC_VERIFICATION }}
      PUBLIC_BING_VERIFICATION: ${{ vars.PUBLIC_BING_VERIFICATION }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: fountainfinances/package-lock.json }
      - name: Require Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see fountainfinances/README.md)"; exit 1
          fi
      - run: npm ci
      - name: Provision D1 database (idempotent) and write its id into wrangler.toml
        run: |
          ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const db=JSON.parse(s).find(d=>d.name==='fountainfinances-db');process.stdout.write(db?db.uuid:'')})")
          if [ -z "$ID" ]; then
            npx wrangler d1 create fountainfinances-db
            ID=$(npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{process.stdout.write(JSON.parse(s).find(d=>d.name==='fountainfinances-db').uuid)})")
          fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
      - run: npx wrangler d1 migrations apply fountainfinances-db --remote
      - run: npm run build
      - name: Create the Pages project on first deploy
        run: npx wrangler pages project list | grep -q ' fountainfinances ' || npx wrangler pages project create fountainfinances --production-branch main
      - run: npx wrangler pages deploy dist --project-name fountainfinances --branch main --commit-dirty=true
