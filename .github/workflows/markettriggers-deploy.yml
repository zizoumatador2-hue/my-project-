name: MarketTriggers (Cloudflare Pages)
# Builds the Astro site in /markettriggers and deploys it to Cloudflare Pages (project "markettriggers").
# - push to branch "markettriggers-live" or the default branch -> production deploy + markettriggers.com domain + DNS
# - any other branch -> preview deploy on *.pages.dev (never touches production or DNS)
on:
  push:
    # markettriggers-live is built and deployed by Cloudflare Workers Builds (connected to this repo).
    branches-ignore: [markettriggers-live]
    paths: ['markettriggers/**', '.github/workflows/markettriggers-deploy.yml']
  workflow_dispatch:
concurrency: markettriggers-deploy
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: markettriggers } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      PROJECT: markettriggers
      DOMAIN: markettriggers.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || { grep -iE "error|failed|invalid|expected|at |→|✘" build.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Check links, anchors and images
        run: node scripts/check-links.mjs
      - name: Decide target
        id: target
        run: |
          DEFAULT="${{ github.event.repository.default_branch }}"
          if [ "${{ github.ref_name }}" = "markettriggers-live" ] || [ "${{ github.ref_name }}" = "$DEFAULT" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"; echo "kind=production" >> "$GITHUB_OUTPUT"
          else
            B=$(echo "${{ github.ref_name }}" | tr -c 'A-Za-z0-9\n' '-' | cut -c1-40)
            echo "branch=$B" >> "$GITHUB_OUTPUT"; echo "kind=preview" >> "$GITHUB_OUTPUT"
          fi
      - name: Credentials (first token that Cloudflare accepts)
        env:
          T1: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          T2: ${{ secrets.CF_API_TOKEN }}
          T3: ${{ secrets.CLOUDFLARE_TOKEN }}
          T4: ${{ secrets.API_TOKEN }}
          T5: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          A1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          A2: ${{ secrets.CF_ACCOUNT_ID }}
          A3: ${{ secrets.ACCOUNT_ID }}
        run: |
          API=https://api.cloudflare.com/client/v4
          TOKEN=""; USED=""
          for N in T1:CLOUDFLARE_API_TOKEN T2:CF_API_TOKEN T3:CLOUDFLARE_TOKEN T4:API_TOKEN T5:CLOUDFLARE_DNS_TOKEN; do
            V="${N%%:*}"; NAME="${N#*:}"; C="$(printf '%s' "${!V}" | tr -d '[:space:]')"
            [ -z "$C" ] && { echo "::notice::$NAME: not set"; continue; }
            echo "::add-mask::$C"
            OK=$(curl -sS -H "Authorization: Bearer $C" "$API/accounts?per_page=5" | jq -r '.success and ((.result|length) > 0)')
            echo "::notice::$NAME: set, accepted=$OK"
            if [ "$OK" = "true" ] && [ -z "$TOKEN" ]; then TOKEN="$C"; USED="$NAME"; fi
          done
          if [ -z "$TOKEN" ]; then echo "::error::No Cloudflare token in this repo is valid. Create a new API token and save it as the CLOUDFLARE_API_TOKEN secret."; exit 1; fi
          echo "::notice::using $USED"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ACC=""
          for V in A1 A2 A3; do C="$(printf '%s' "${!V}" | tr -d '[:space:]')"; [ -n "$C" ] && { ACC="$C"; break; }; done
          [ -z "$ACC" ] && ACC=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$API/accounts?per_page=5" | jq -r '.result[0].id // empty')
          if [ -z "$ACC" ]; then echo "::error::Could not determine the Cloudflare account id"; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
      - name: Ensure Pages project exists
        continue-on-error: true
        run: |
          R=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}")
          echo "$R" | jq -r 'if .success then "created project" else (.errors[0].message // "unknown") end' || true
      - name: Deploy to Cloudflare Pages
        id: pages
        continue-on-error: true
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch "${{ steps.target.outputs.branch }}" --commit-dirty=true | tee deploy.log
          URL=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Free the hostnames from the old pending Pages hookups (production only)
        if: ${{ steps.target.outputs.kind == 'production' }}
        continue-on-error: true
        run: |
          for D in $DOMAIN www.$DOMAIN; do
            R=$(curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$D")
            echo "::notice::pages-domain $D removal: $(echo "$R" | jq -c '{ok:.success,err:.errors[0].message}')"
          done
      - name: Serve markettriggers.com from Workers static assets (production only)
        id: worker
        if: ${{ steps.target.outputs.kind == 'production' }}
        run: |
          npx --yes wrangler@4 deploy --config wrangler.assets.toml 2>&1 | tee worker.log
          echo "::notice::worker-deploy: $(grep -E 'markettriggers|Deployed|custom domain|error|Error' worker.log | tr '\n' ' ' | cut -c1-600)"
      - name: Fail if nothing was deployed
        if: ${{ steps.pages.outcome != 'success' && steps.worker.outcome != 'success' }}
        run: |
          echo "::error::Deploy failed on Pages and on Workers."
          exit 1
      - name: Report domain status
        if: ${{ always() && steps.target.outputs.kind == 'production' }}
        run: |
          API=https://api.cloudflare.com/client/v4; H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo "::notice::worker-domains: $(curl -sS -H "$H" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" | jq -c '[.result[]? | select(.hostname|test("markettriggers")) | {hostname,service,cert_id}]')"
          sleep 20
          echo "::notice::public-dns: root=$(dig +short $DOMAIN | tr '\n' ' ') www=$(dig +short www.$DOMAIN | tr '\n' ' ')"
          echo "::notice::live-title: $(curl -sSL --max-time 20 https://$DOMAIN/ | grep -oE '<title>[^<]*' | head -1)"
      - name: Screenshots of the preview (preview deploys only)
        if: ${{ steps.target.outputs.kind == 'preview' && steps.pages.outcome == 'success' }}
        continue-on-error: true
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.url }}
        run: |
          mkdir -p /tmp/shots && cd /tmp/shots && npm init -y >/dev/null && npm i -s playwright@1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const base = process.env.PREVIEW_URL.replace(/\/$/, '');
          const pages = [['home', '/'], ['hub', '/economic-indicators/'], ['privacy', '/privacy-policy/']];
          const b = await chromium.launch();
          for (const [vp, w, h, mobile] of [['desktop', 1366, 900, false], ['mobile', 390, 844, true]]) {
            const ctx = await b.newContext({ viewport: { width: w, height: h }, isMobile: mobile, hasTouch: mobile, deviceScaleFactor: 1 });
            const p = await ctx.newPage();
            for (const [name, path] of pages) {
              await p.goto(base + path, { waitUntil: 'networkidle' });
              await p.waitForTimeout(800);
              await p.screenshot({ path: `${vp}-${name}-top.png` });
              if (name === 'home') {
                for (const [tag, sel] of [['fig', 'figure.photo'], ['explorer', '#trigger-explorer']]) {
                  await p.locator(sel).first().scrollIntoViewIfNeeded(); await p.waitForTimeout(900);
                  await p.screenshot({ path: `${vp}-home-${tag}.png` });
                }
              }
              const sw = await p.evaluate(() => document.documentElement.scrollWidth);
              console.log(vp, name, 'scrollWidth', sw);
            }
            await ctx.close();
          }
          await b.close();
          JS
          node shot.mjs
          cd "$GITHUB_WORKSPACE" && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan mt-shots && git rm -rfq . && cp /tmp/shots/*.png . && git add *.png && git commit -qm "preview screenshots" && git push -f origin mt-shots
      - name: Summary
        if: always()
        run: |
          echo "MarketTriggers ${{ steps.target.outputs.kind }} deploy (branch ${{ steps.target.outputs.branch }})." >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.pages.outputs.url || steps.worker.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
