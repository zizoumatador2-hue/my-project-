name: BamaMotors Deploy
on:
  push:
    branches: [ccr-949c33b0-3w3w8k, claude/trusttransfer-marketplace-7xcesu, main]
    paths: ['bamamotors/**', '.github/workflows/bamamotors-deploy.yml']
  workflow_dispatch:
concurrency: bamamotors-deploy
defaults:
  run:
    working-directory: bamamotors
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      # Set CUSTOM_DOMAIN (repo variable) to e.g. bamamotors.com once the domain is attached to the Worker.
      # Until then the site runs on workers.dev and robots.txt blocks indexing (no duplicate of the real domain).
      CUSTOM_DOMAIN: ${{ vars.BAMAMOTORS_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: bamamotors/package-lock.json }
      - name: Normalize credentials
        run: |
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ACC="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$ACC" ]; then ACC=$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty'); fi
          if [ -z "$ACC" ]; then echo "::error::Could not determine the Cloudflare account id"; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Resolve public URL
        id: url
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then HOST="$CUSTOM_DOMAIN"; ENVIRONMENT=production; else
            SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
            if [ -z "$SUB" ] || [ "$SUB" = "null" ]; then echo "::error::No workers.dev subdomain on this account"; exit 1; fi
            HOST="bamamotors.$SUB.workers.dev"; ENVIRONMENT=preview
          fi
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
      - name: Build
        run: SITE_URL="https://${{ steps.url.outputs.host }}" npm run build
      - name: Apply D1 migrations
        id: migrate
        continue-on-error: true
        run: npx wrangler d1 migrations apply bamamotors-db --remote
      - name: Deploy worker
        run: npx wrangler deploy --var SITE_URL:https://${{ steps.url.outputs.host }} --var ENVIRONMENT:${{ steps.url.outputs.environment }}
      - name: Provision secrets (generate missing ones once; never printed)
        env:
          SESSION_SECRET: ${{ secrets.BAMAMOTORS_SESSION_SECRET }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BAMAMOTORS_ADMIN_EMAIL || secrets.BOOTSTRAP_ADMIN_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.BAMAMOTORS_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.BAMAMOTORS_STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_BASIC: ${{ secrets.BAMAMOTORS_STRIPE_PRICE_BASIC }}
          STRIPE_PRICE_PRO: ${{ secrets.BAMAMOTORS_STRIPE_PRICE_PRO }}
        run: |
          EXISTING=$(npx wrangler secret list --format json 2>/dev/null | jq -r '.[].name' || true)
          node -e 'const k=["SESSION_SECRET","BOOTSTRAP_ADMIN_EMAIL","RESEND_API_KEY","STRIPE_SECRET_KEY","STRIPE_WEBHOOK_SECRET","STRIPE_PRICE_BASIC","STRIPE_PRICE_PRO"];const o={};for(const x of k)if(process.env[x])o[x]=process.env[x];require("fs").writeFileSync("/tmp/s.json",JSON.stringify(o))'
          if ! echo "$EXISTING" | grep -qx SESSION_SECRET && [ -z "$SESSION_SECRET" ]; then
            jq --arg v "$(openssl rand -base64 48)" '. + {SESSION_SECRET: $v}' /tmp/s.json > /tmp/s2.json && mv /tmp/s2.json /tmp/s.json; echo "generated SESSION_SECRET"
          fi
          echo "syncing $(jq 'length' /tmp/s.json) secrets"
          if [ "$(jq 'length' /tmp/s.json)" != "0" ]; then npx wrangler secret bulk /tmp/s.json; fi
          rm -f /tmp/s.json
      - name: Smoke test
        run: |
          sleep 8
          H="https://${{ steps.url.outputs.host }}"
          for p in / /used-cars /used-cars/birmingham-al /blog /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$H$p"); echo "$p → $code"; [ "$code" = "200" ] || exit 1
          done
          echo "migrations step: ${{ steps.migrate.outcome }}"
          echo "Live at $H" >> "$GITHUB_STEP_SUMMARY"
