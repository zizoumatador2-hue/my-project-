name: CI
on:
  pull_request:
    paths-ignore: ['fountainfinances/**', '.github/workflows/fountainfinances.yml']
  push:
    branches: [main]
    paths-ignore: ['fountainfinances/**', '.github/workflows/fountainfinances.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Local dev secrets (test-only values)
        run: |
          cp .dev.vars.example .dev.vars
          sed -i "s#REPLACE_WITH_BASE64_32_BYTES#$(openssl rand -base64 32)#" .dev.vars
      - name: Start worker (local D1/KV/R2/Queues)
        run: DEV_LOG=/tmp/wrangler.log ./scripts/dev-restart.sh --fresh
        env: { WRANGLER_SEND_METRICS: 'false' }
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: { SHOTS_DIR: /tmp/shots }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            test-results
            /tmp/shots
            /tmp/wrangler.log
