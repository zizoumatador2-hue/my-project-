name: SpiceVacations
on:
  pull_request:
    paths: ['spicevacations/**', '.github/workflows/spicevacations.yml']
  push:
    branches: [main, claude/spicevacations-astro-seo-5avt34]
    paths: ['spicevacations/**', '.github/workflows/spicevacations.yml']
  workflow_dispatch:
concurrency: spicevacations-${{ github.ref }}
defaults:
  run:
    working-directory: spicevacations
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
      PUBLIC_ADSENSE_SLOT_ARTICLE: ${{ vars.PUBLIC_ADSENSE_SLOT_ARTICLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: spicevacations/package-lock.json }
      - run: npm ci
      - name: Restore Pexels photo cache
        uses: actions/cache@v4
        with:
          path: |
            spicevacations/public/photos
            spicevacations/src/data/photos.json
          key: pexels-${{ hashFiles('spicevacations/src/content/**', 'spicevacations/scripts/fetch-photos.mjs') }}
          restore-keys: pexels-
      - name: Fetch photos from Pexels (skipped when PEXELS_API_KEY is not set)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || vars.PEXELS_API_KEY }}
        run: node scripts/fetch-photos.mjs
      - run: npm run report:content
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run audit:seo
      - uses: actions/upload-artifact@v4
        with: { name: spicevacations-dist, path: spicevacations/dist, retention-days: 7 }

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      DOMAIN: spicevacations.com
      PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
      PUBLIC_ADSENSE_SLOT_ARTICLE: ${{ vars.PUBLIC_ADSENSE_SLOT_ARTICLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: spicevacations/package-lock.json }
      - name: Normalize credentials
        run: |
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ACC="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$ACC" ]; then
            ACC=$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty')
          fi
          if [ -z "$ACC" ]; then echo "::error::Could not determine the Cloudflare account id"; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Restore Pexels photo cache
        uses: actions/cache@v4
        with:
          path: |
            spicevacations/public/photos
            spicevacations/src/data/photos.json
          key: pexels-${{ hashFiles('spicevacations/src/content/**', 'spicevacations/scripts/fetch-photos.mjs') }}
          restore-keys: pexels-
      - name: Fetch photos from Pexels (skipped when PEXELS_API_KEY is not set)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || vars.PEXELS_API_KEY }}
        run: node scripts/fetch-photos.mjs
      - run: npm run build
      - name: Deploy Worker + static assets
        run: npx wrangler deploy
      - name: Attach custom domain (only if the zone is on this Cloudflare account)
        continue-on-error: true
        run: |
          ZONE=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE" ]; then
            echo "::notice::$DOMAIN is not a zone on this Cloudflare account yet. Add the domain in Cloudflare (Websites → Add a site) and point its nameservers to Cloudflare; the next deploy attaches it automatically."
            exit 0
          fi
          for HOST in "$DOMAIN" "www.$DOMAIN"; do
            curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
              -d "{\"hostname\":\"$HOST\",\"service\":\"spicevacations\",\"zone_id\":\"$ZONE\",\"environment\":\"production\"}" | jq -c '{success, errors}'
          done
      - name: Smoke test
        run: |
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          HOST="spicevacations.$SUB.workers.dev"
          sleep 5
          curl -fsS "https://$HOST/api/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$HOST/guides/best-romantic-getaways-in-florida/")" = "200"
          echo "Live at https://$HOST (custom domain: https://$DOMAIN once DNS is on Cloudflare)" >> "$GITHUB_STEP_SUMMARY"
