name: ChayStore (Cloudflare Pages)
# Builds the Astro site in /chaystore and deploys it to Cloudflare Pages (project "chaystore").
# - push to the default branch (changes under chaystore/) or manual run with production=true -> production deploy
# - any other branch -> preview deploy (never touches production)
on:
  push:
    paths: ['chaystore/**', '.github/workflows/chaystore-deploy.yml']
  workflow_dispatch:
    inputs:
      production:
        description: 'Deploy to production (the main/production branch of the Pages project)'
        type: boolean
        default: false
      attach_domain:
        description: 'Also attach chaystore.com and www.chaystore.com to the Pages project'
        type: boolean
        default: false
      create_dns:
        description: 'Create proxied CNAME records for chaystore.com and www in the Cloudflare zone (only if missing; never overwrites)'
        type: boolean
        default: false
concurrency: chaystore-deploy
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: chaystore } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      PROJECT: chaystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: chaystore/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run check:links
      - name: Decide target
        id: target
        run: |
          DEFAULT="${{ github.event.repository.default_branch }}"
          if [ "${{ inputs.production }}" = "true" ] || [ "${{ github.ref_name }}" = "$DEFAULT" ] || [ "${{ github.ref_name }}" = "ccr-e0043d8a-w9hvge" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"; echo "kind=production" >> "$GITHUB_OUTPUT"
          else
            B=$(echo "${{ github.ref_name }}" | tr -c 'A-Za-z0-9\n' '-' | cut -c1-40)
            echo "branch=$B" >> "$GITHUB_OUTPUT"; echo "kind=preview" >> "$GITHUB_OUTPUT"
          fi
      - name: Credentials (trim; derive account id from the token if needed)
        run: |
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ACC="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$ACC" ]; then
            ACC=$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty')
          fi
          if [ -z "$ACC" ]; then echo "::error::Could not determine the Cloudflare account id; add a CLOUDFLARE_ACCOUNT_ID secret"; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
      - name: Ensure Pages project exists
        continue-on-error: true
        run: |
          R=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}")
          echo "$R" | jq -r 'if .success then "created project" else (.errors[0].message // "unknown") end' || true
          # "already exists" or missing permission is fine here; the deploy step reports real failures.
      - name: Deploy to Cloudflare Pages
        id: pages
        continue-on-error: true
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch "${{ steps.target.outputs.branch }}" --commit-dirty=true | tee deploy.log
          URL=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Fallback, serve from Workers static assets (token without Pages permission; production only)
        id: worker
        if: ${{ steps.pages.outcome != 'success' && steps.target.outputs.kind == 'production' }}
        run: |
          echo "::warning::Pages deploy failed (the token likely lacks 'Cloudflare Pages: Edit'). Deploying the static site as a Worker instead."
          npx --yes wrangler@4 deploy --config wrangler.assets.toml
          SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          echo "url=https://chaystore.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
      - name: Fail if nothing was deployed
        if: ${{ steps.pages.outcome != 'success' && steps.worker.outcome != 'success' }}
        run: |
          echo "::error::Deploy failed on Pages and on the fallback. Check token permissions (Cloudflare Pages Edit, Workers Scripts Edit)."
          exit 1
      - name: Attach custom domains (optional)
        if: ${{ steps.target.outputs.kind == 'production' && (inputs.attach_domain || github.ref_name == 'ccr-e0043d8a-w9hvge') }}
        run: |
          for D in chaystore.com www.chaystore.com; do
            R=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" -d "{\"name\":\"$D\"}")
            echo "$D: $(echo "$R" | jq -r 'if .success then "attached (status: " + (.result.status // "pending") + ")" else (.errors[0].message // "failed") end')"
          done
      - name: Report custom-domain status
        if: ${{ steps.target.outputs.kind == 'production' && (inputs.attach_domain || github.ref_name == 'ccr-e0043d8a-w9hvge') }}
        run: |
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            | jq -r '.result[]? | "\(.name): status=\(.status) validation=\(.validation_data.status // "-") verification=\(.verification_data.status // "-") error=\(.validation_data.error_message // .verification_data.error_message // "-")"'
      - name: Point chaystore.com and www at the Pages project (replaces conflicting A/AAAA/CNAME records)
        if: ${{ steps.target.outputs.kind == 'production' && (inputs.create_dns || github.ref_name == 'ccr-e0043d8a-w9hvge') }}
        env:
          DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
        run: |
          # Uses CLOUDFLARE_DNS_TOKEN (Zone > DNS > Edit on chaystore.com) when set, else the deploy token.
          T="$(printf '%s' "${DNS_TOKEN:-$CLOUDFLARE_API_TOKEN}" | tr -d '[:space:]')"
          echo "::add-mask::$T"
          API="https://api.cloudflare.com/client/v4"; H="Authorization: Bearer $T"
          Z=$(curl -sS -H "$H" "$API/zones?name=chaystore.com")
          ZID=$(echo "$Z" | jq -r '.result[0].id // empty')
          if [ -z "$ZID" ]; then
            echo "::error::Zone chaystore.com not visible to this token ($(echo "$Z" | jq -r '.errors[0].message // "no zone"')). Add the secret CLOUDFLARE_DNS_TOKEN (Zone > DNS > Edit, Zone > Zone > Read for chaystore.com)."; exit 1
          fi
          echo "zone status: $(echo "$Z" | jq -r '.result[0].status') ns: $(echo "$Z" | jq -r '.result[0].name_servers | join(",")')"
          fail=0
          for N in chaystore.com www.chaystore.com; do
            L=$(curl -sS -H "$H" "$API/zones/$ZID/dns_records?name=$N&per_page=100")
            if [ "$(echo "$L" | jq -r '.success')" != "true" ]; then
              echo "::error::$N: cannot read DNS records ($(echo "$L" | jq -r '.errors[0].message // "unknown"')). The token needs Zone > DNS > Edit."; fail=1; continue
            fi
            OK=$(echo "$L" | jq -r --arg t "$PROJECT.pages.dev" '[.result[] | select(.type=="CNAME" and .content==$t)] | length')
            if [ "$OK" != "0" ]; then echo "$N: CNAME to $PROJECT.pages.dev already present"; continue; fi
            for row in $(echo "$L" | jq -r --arg n "$N" '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME" or ($n=="www.chaystore.com" and .type=="MX")) | "\(.id):\(.type):\(.content)"'); do
              id="${row%%:*}"; echo "$N: deleting ${row#*:}"
              curl -sS -X DELETE -H "$H" "$API/zones/$ZID/dns_records/$id" | jq -r 'if .success then "  deleted" else "  delete failed: " + (.errors[0].message // "?") end'
            done
            R=$(curl -sS -X POST -H "$H" -H "Content-Type: application/json" "$API/zones/$ZID/dns_records" \
              -d "{\"type\":\"CNAME\",\"name\":\"$N\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true,\"ttl\":1}")
            echo "$N: $(echo "$R" | jq -r 'if .success then "CNAME created" else "FAILED: " + (.errors[0].message // "?") end')"
            echo "$R" | jq -e '.success' >/dev/null || fail=1
          done
          exit $fail
      - name: Summary
        run: |
          echo "ChayStore ${{ steps.target.outputs.kind }} deploy finished (branch ${{ steps.target.outputs.branch }})." >> "$GITHUB_STEP_SUMMARY"
          echo "Live URL: ${{ steps.pages.outputs.url || steps.worker.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
