name = "bamamotors"
main = "dist/_worker.js/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

# Create with: npx wrangler d1 create bamamotors-db  → paste the id below.
[[d1_databases]]
binding = "DB"
database_name = "bamamotors-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Create with: npx wrangler r2 bucket create bamamotors-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "bamamotors-media"

[vars]
SITE_URL = "https://bamamotors.com"
ENVIRONMENT = "production"
EMAIL_FROM = "BamaMotors <no-reply@bamamotors.com>"
PUBLIC_CACHE_TTL = "120"
# Secrets — set with `npx wrangler secret put NAME`, never commit them:
#   SESSION_SECRET, BOOTSTRAP_ADMIN_EMAIL, RESEND_API_KEY,
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_BASIC, STRIPE_PRICE_PRO, STRIPE_PRICE_FEATURED,
#   TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY
