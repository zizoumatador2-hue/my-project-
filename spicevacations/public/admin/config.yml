# Decap CMS configuration: a Git-based editor for the Markdown collections in src/content.
# Editors log in with GitHub and every save becomes a commit (or a pull request with
# the editorial workflow below), which triggers a rebuild and deploy on Cloudflare.
backend:
  name: github
  repo: zizoumatador2-hue/my-project-
  branch: main
publish_mode: editorial_workflow
media_folder: spicevacations/public/uploads
public_folder: /uploads
site_url: https://spicevacations.com
display_url: https://spicevacations.com
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
  - name: destinations
    label: Destinations
    folder: spicevacations/src/content/destinations
    create: true
    identifier_field: name
    summary: '{{name}} — {{region}}'
    fields:
      - label: Name
        name: name
        widget: string
      - label: SEO title (≤ 62 chars)
        name: metaTitle
        widget: string
        pattern:
          - ^.{20,62}$
          - 20–62 characters
      - label: Meta description (110–165 chars)
        name: metaDescription
        widget: text
        pattern:
          - ^[\s\S]{110,165}$
          - 110–165 characters
      - label: Canonical URL (optional)
        name: canonical
        widget: string
        required: false
      - label: Noindex
        name: noindex
        widget: boolean
        default: false
      - label: Illustration scene
        name: scene
        widget: select
        options:
          - beach
          - sunset
          - tropical
          - overwater
          - mountains
          - city
          - desert
          - cliffs
          - vineyard
          - lake
          - cruise
          - pool
          - volcano
          - harbor
        default: beach
      - label: Illustration palette
        name: palette
        widget: select
        options:
          - coral
          - gold
          - teal
          - dusk
          - night
        default: coral
      - label: Photo (optional
        overrides illustration): null
        name: image
        widget: image
        required: false
      - label: Image alt text
        name: imageAlt
        widget: string
        pattern:
          - ^.{10,}$
          - Describe the image (10+ characters)
      - label: Image credit
        name: imageCredit
        widget: string
        required: false
      - label: Region
        name: region
        widget: select
        options:
          - usa
          - mexico
          - caribbean
      - label: Country
        name: country
        widget: string
      - label: State (optional)
        name: state
        widget: string
        required: false
      - label: Tagline
        name: tagline
        widget: string
      - label: Summary
        name: summary
        widget: text
      - label: Best months (1–12)
        name: bestMonths
        widget: list
        field:
          label: Month
          name: m
          widget: number
          value_type: int
          min: 1
          max: 12
      - label: Best time note
        name: bestTimeNote
        widget: string
      - label: Airports
        name: airports
        widget: list
        required: false
      - label: Ideal for
        name: idealFor
        widget: select
        multiple: true
        options:
          - couples
          - honeymooners
          - families
          - friends
          - solo
      - label: Budget styles
        name: budgetStyles
        widget: select
        multiple: true
        options:
          - value
          - mid-range
          - splurge
      - label: Vacation types (slugs)
        name: vacationTypes
        widget: relation
        collection: vacation-types
        value_field: '{{slug}}'
        search_fields:
          - name
        multiple: true
      - label: Activities
        name: activities
        widget: list
      - label: Highlights
        name: highlights
        widget: list
        fields:
          - label: Title
            name: title
            widget: string
          - label: Text
            name: text
            widget: text
      - label: Featured
        name: featured
        widget: boolean
        default: false
      - label: Order
        name: order
        widget: number
        default: 100
      - label: FAQs
        name: faqs
        widget: list
        required: false
        fields:
          - label: Question
            name: q
            widget: string
          - label: Answer
            name: a
            widget: text
      - label: Updated
        name: updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: Body
        name: body
        widget: markdown
