# Cloudflare Pages project: static Astro build + Pages Functions in ./functions
name = "fountainfinances"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

[vars]
SITE_URL = "https://www.fountainfinances.com"

[[d1_databases]]
binding = "DB"
database_name = "fountainfinances-db"
# Created 2026-10-05 (ENAM). The deploy workflow keeps this id in sync if the token can manage D1.
database_id = "5e159827-1921-4f53-b186-3a1d818df1c9"
migrations_dir = "migrations"
