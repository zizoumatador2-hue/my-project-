# Cloudflare Pages project: static Astro build + Pages Functions in ./functions
name = "fountainfinances"
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-01"

[vars]
SITE_URL = "https://www.fountainfinances.com"

[[d1_databases]]
binding = "DB"
database_name = "fountainfinances-db"
# Replace with the id printed by `wrangler d1 create fountainfinances-db` (the deploy workflow does this automatically).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
